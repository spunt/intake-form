<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="title-slot">Intake</title>
<style>
/* intake-form base styles — shared across all generated forms */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ============================================================
   Theme tokens (--if-*)
   OKLCH-only color, neutrals tinted toward --if-hue.
   Theme presets override via :root[data-theme="<preset>"].
   ============================================================ */
:root,
:root[data-theme="default"] {
  /* Brand identity */
  --if-hue: 235;
  --if-hue-accent: var(--if-hue);

  /* Surfaces & neutrals — bg/surface-soft tinted toward --if-hue; surface is pure white.
     Pure-white surface expressed as oklch(1 0 0) (not literal #fff) to keep the OKLCH-only
     contract while sidestepping axe-core 4.x's lossy OKLCH-to-sRGB conversion at near-white. */
  --if-color-bg:            oklch(98.4% 0.005 var(--if-hue));
  --if-color-surface:       oklch(1     0     0);
  --if-color-surface-soft:  oklch(98.4% 0.005 var(--if-hue));
  --if-color-border:        oklch(91%   0.010 var(--if-hue));
  --if-color-border-strong: oklch(85%   0.013 var(--if-hue));

  /* Text scale (tinted neutrals) — L values calibrated for WCAG 2.2 AA across all hues */
  --if-color-text:          oklch(18%   0.020 var(--if-hue));
  --if-color-text-muted:    oklch(42%   0.025 var(--if-hue));
  --if-color-text-dim:      oklch(55%   0.020 var(--if-hue));

  /* Accent — committed chroma; L tuned for AA contrast on near-white across all hues */
  --if-color-accent:        oklch(44%   0.14  var(--if-hue-accent));
  --if-color-accent-hover:  oklch(50%   0.15  var(--if-hue-accent));
  --if-color-accent-soft:   oklch(94%   0.035 var(--if-hue-accent));
  --if-color-accent-soft2:  oklch(90%   0.060 var(--if-hue-accent));
  --if-color-accent-ring:   oklch(44%   0.14  var(--if-hue-accent) / 0.18);
  --if-color-accent-border: oklch(44%   0.14  var(--if-hue-accent) / 0.20);
  --if-color-on-accent:     oklch(1     0     0);

  /* Semantic — independent hues */
  --if-color-success:       oklch(52%   0.16  145);
  --if-color-warning:       oklch(53%   0.15  60);
  --if-color-danger:        oklch(50%   0.20  25);

  /* Info surface — derived from brand hue */
  --if-color-info-bg:       oklch(97%   0.015 var(--if-hue));
  --if-color-info-border:   oklch(86%   0.060 var(--if-hue));
  --if-color-info-text:     oklch(38%   0.16  var(--if-hue));

  /* Typography stacks */
  --if-font-sans:    system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --if-font-serif:   ui-serif, "Iowan Old Style", "Apple Garamond", Baskerville, "Times New Roman", serif;
  --if-font-mono:    ui-monospace, "SF Mono", "Fira Code", "JetBrains Mono", Menlo, monospace;
  --if-font-display: var(--if-font-sans);
  --if-font-body:    var(--if-font-sans);

  /* Type scale — calibrated for compact form UI; key hierarchy steps ≥1.25 */
  --if-text-meta:   10px;
  --if-text-xs:     11px;
  --if-text-sm:     12px;
  --if-text-base:   13px;
  --if-text-md:     15px;
  --if-text-lg:     20px;
  --if-text-xl:     26px;
  --if-text-2xl:    34px;

  /* Type weights */
  --if-weight-regular:  400;
  --if-weight-medium:   500;
  --if-weight-semibold: 600;
  --if-weight-bold:     700;

  /* Tracking & leading */
  --if-tracking-tight:  -0.02em;
  --if-tracking-snug:   -0.01em;
  --if-tracking-normal: 0;
  --if-tracking-wide:   0.05em;
  --if-tracking-wider:  0.07em;
  --if-leading-tight:   1.25;
  --if-leading-snug:    1.4;
  --if-leading-normal:  1.55;
  --if-leading-relaxed: 1.65;

  /* Spacing scale (4px base) */
  --if-space-1:   4px;
  --if-space-2:   8px;
  --if-space-3:   12px;
  --if-space-4:   16px;
  --if-space-5:   20px;
  --if-space-6:   24px;
  --if-space-7:   28px;
  --if-space-8:   32px;
  --if-space-10:  40px;
  --if-space-12:  48px;

  /* Density multiplier (themes/spec may override) */
  --if-density: 1;

  /* Radii */
  --if-radius-xs: 3px;
  --if-radius-sm: 4px;
  --if-radius:    6px;
  --if-radius-lg: 10px;
  --if-radius-xl: 14px;

  /* Motion — ease-out only; never bouncy/elastic */
  --if-ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --if-ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
  --if-ease-out-expo:  cubic-bezier(0.16, 1, 0.3, 1);
  --if-duration-fast:  120ms;
  --if-duration-base:  180ms;
  --if-duration-slow:  280ms;

  /* Elevation — neutral-tinted shadows */
  --if-shadow-sm:
    0 1px 2px oklch(20% 0.02 var(--if-hue) / 0.06),
    0 1px 3px oklch(20% 0.02 var(--if-hue) / 0.04);
  --if-shadow-md:
    0 4px 8px oklch(20% 0.02 var(--if-hue) / 0.08),
    0 2px 4px oklch(20% 0.02 var(--if-hue) / 0.05);

  /* ============================================================
     Legacy aliases — backwards compatibility for existing rules.
     New code MUST use --if-* tokens, not these.
     ============================================================ */
  --bg:             var(--if-color-bg);
  --surface:        var(--if-color-surface);
  --surface2:       var(--if-color-surface-soft);
  --border:         var(--if-color-border);
  --border-strong:  var(--if-color-border-strong);
  --accent:         var(--if-color-accent);
  --accent-hover:   var(--if-color-accent-hover);
  --accent-muted:   var(--if-color-accent-soft);
  --accent-muted2:  var(--if-color-accent-soft2);
  --text:           var(--if-color-text);
  --text-muted:     var(--if-color-text-muted);
  --text-dim:       var(--if-color-text-dim);
  --success:        var(--if-color-success);
  --warning:        var(--if-color-warning);
  --info-bg:        var(--if-color-info-bg);
  --info-border:    var(--if-color-info-border);
  --info-text:      var(--if-color-info-text);
  --radius:         var(--if-radius);
  --radius-sm:      var(--if-radius-sm);
  --font:           var(--if-font-sans);
  --mono:           var(--if-font-mono);
  --shadow-sm:      var(--if-shadow-sm);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --if-duration-fast: 1ms;
    --if-duration-base: 1ms;
    --if-duration-slow: 1ms;
  }
}

/* ── Theme presets ───────────────────────────────────────── */

/* Editorial: serif body, warm paper, deep ink-blue accent, airy + deliberate motion */
:root[data-theme="editorial"] {
  --font:            var(--if-font-serif);
  --if-font-display: var(--if-font-serif);
  --if-font-body:    var(--if-font-serif);

  --if-hue:                 230;
  --if-color-accent:        oklch(42%   0.160 230);
  --if-color-accent-hover:  oklch(35%   0.150 230);
  --if-color-accent-soft:   oklch(93%   0.040 230);
  --if-color-accent-soft2:  oklch(87%   0.065 230);
  --if-color-accent-ring:   oklch(42%   0.160 230 / 0.18);
  --if-color-accent-border: oklch(42%   0.160 230 / 0.20);

  --if-color-bg:            oklch(97.5% 0.010  80);
  --if-color-surface:       oklch(99.2% 0.004  80);
  --if-color-surface-soft:  oklch(95.5% 0.014  80);
  --if-color-border:        oklch(87.5% 0.012  80);
  --if-color-border-strong: oklch(74%   0.018  80);

  --if-color-text:          oklch(17%   0.018 240);
  --if-color-text-muted:    oklch(46%   0.022 230);
  --if-color-text-dim:      oklch(50%   0.020 230);

  --if-color-info-bg:       oklch(96.5% 0.018 230);
  --if-color-info-border:   oklch(85%   0.065 230);
  --if-color-info-text:     oklch(38%   0.160 230);

  --if-duration-fast:       150ms;
  --if-duration-base:       240ms;
  --if-duration-slow:       380ms;
  --if-ease-out-quart:      cubic-bezier(0.22, 1, 0.36, 1);

  --if-density: 1.15;
}

/* Terminal: monospace primary, dark surface, bright green accent, snappy motion */
:root[data-theme="terminal"] {
  --font:            var(--if-font-mono);
  --if-font-display: var(--if-font-mono);
  --if-font-body:    var(--if-font-mono);

  --if-hue:                 240;
  --if-color-accent:        oklch(72%   0.22  150);
  --if-color-accent-hover:  oklch(78%   0.22  150);
  --if-color-accent-soft:   oklch(20%   0.045 150);
  --if-color-accent-soft2:  oklch(24%   0.060 150);
  --if-color-accent-ring:   oklch(72%   0.22  150 / 0.28);
  --if-color-accent-border: oklch(72%   0.22  150 / 0.30);
  --if-color-on-accent:     oklch(10%   0.008 240);

  --if-color-bg:            oklch(12%   0.008 240);
  --if-color-surface:       oklch(15%   0.008 240);
  --if-color-surface-soft:  oklch(18%   0.010 240);
  --if-color-border:        oklch(25%   0.012 240);
  --if-color-border-strong: oklch(32%   0.015 240);

  --if-color-text:          oklch(90%   0.008 240);
  --if-color-text-muted:    oklch(66%   0.012 240);
  --if-color-text-dim:      oklch(58%   0.010 240);

  --if-color-info-bg:       oklch(18%   0.030 150);
  --if-color-info-border:   oklch(30%   0.080 150);
  --if-color-info-text:     oklch(72%   0.22  150);

  --if-duration-fast:        80ms;
  --if-duration-base:       120ms;
  --if-duration-slow:       180ms;

  --if-density: 0.9;
}

/* Kraft: warm amber-tinted neutrals, sans-serif, slower quint motion. Creative briefs, warm brand voice. */
:root[data-theme="kraft"] {
  --font:            var(--if-font-sans);
  --if-font-display: var(--if-font-sans);
  --if-font-body:    var(--if-font-sans);

  --if-hue:                 70;
  --if-color-accent:        oklch(44%   0.135  55);
  --if-color-accent-hover:  oklch(38%   0.130  55);
  --if-color-accent-soft:   oklch(93%   0.045  70);
  --if-color-accent-soft2:  oklch(89%   0.065  70);
  --if-color-accent-ring:   oklch(44%   0.135  55 / 0.22);
  --if-color-accent-border: oklch(44%   0.135  55 / 0.24);

  --if-color-bg:            oklch(95.5% 0.024  75);
  --if-color-surface:       oklch(98.5% 0.012  75);
  --if-color-surface-soft:  oklch(93%   0.030  75);
  --if-color-border:        oklch(86%   0.028  75);
  --if-color-border-strong: oklch(72%   0.036  70);

  --if-color-text:          oklch(22%   0.030  60);
  --if-color-text-muted:    oklch(44%   0.032  60);
  --if-color-text-dim:      oklch(47%   0.030  60);

  --if-color-info-bg:       oklch(94%   0.040  75);
  --if-color-info-border:   oklch(80%   0.075  70);
  --if-color-info-text:     oklch(45%   0.120  55);

  --if-duration-fast:       140ms;
  --if-duration-base:       230ms;
  --if-duration-slow:       360ms;
  --if-ease-out-quint:      cubic-bezier(0.22, 1, 0.36, 1);

  --if-density: 1.05;
}

/* Studio: clean neutral surfaces with a distinct violet accent for brand-heavy forms with section identity. */
:root[data-theme="studio"] {
  --font:            var(--if-font-sans);
  --if-font-display: var(--if-font-sans);
  --if-font-body:    var(--if-font-sans);

  --if-hue:                 290;
  --if-color-accent:        oklch(48%   0.180 300);
  --if-color-accent-hover:  oklch(41%   0.185 300);
  --if-color-accent-soft:   oklch(94%   0.035 300);
  --if-color-accent-soft2:  oklch(89%   0.060 300);
  --if-color-accent-ring:   oklch(48%   0.180 300 / 0.20);
  --if-color-accent-border: oklch(48%   0.180 300 / 0.22);

  --if-color-bg:            oklch(97.5% 0.004 290);
  --if-color-surface:       oklch(99.5% 0.002 290);
  --if-color-surface-soft:  oklch(96%   0.008 290);
  --if-color-border:        oklch(88%   0.008 290);
  --if-color-border-strong: oklch(74%   0.012 290);

  --if-color-text:          oklch(18%   0.014 300);
  --if-color-text-muted:    oklch(46%   0.018 300);
  --if-color-text-dim:      oklch(52%   0.016 300);

  --if-color-info-bg:       oklch(96%   0.020 300);
  --if-color-info-border:   oklch(85%   0.055 300);
  --if-color-info-text:     oklch(44%   0.170 300);

  --if-duration-fast:       120ms;
  --if-duration-base:       190ms;
  --if-duration-slow:       300ms;

  --if-density: 1.0;
}

body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 0 80px; }

.topbar { width: 100%; background: var(--if-color-surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 48px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.topbar-title { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.layout-toggle { display: flex; background: var(--if-color-surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.layout-toggle button { padding: 5px 13px; font-size: 11px; font-weight: 600; border: none; background: var(--if-color-surface); color: var(--if-color-text-muted); cursor: pointer; font-family: var(--font); transition: background 0.15s; }
.layout-toggle button:hover { color: var(--if-color-text); }
.layout-toggle button.active { background: var(--accent); color: var(--if-color-on-accent); }

/* Theme switcher */
.theme-menu-wrap { position: relative; }
.theme-menu-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--if-color-border-strong); border-radius: var(--if-radius-sm);
  background: var(--if-color-surface); color: var(--if-color-text-muted);
  cursor: pointer; font-family: var(--font);
  transition: color var(--if-duration-fast), border-color var(--if-duration-fast);
}
.theme-menu-btn:hover { color: var(--if-color-text); border-color: var(--if-color-accent); }
.theme-menu-wrap.open .theme-menu-btn { color: var(--if-color-text); border-color: var(--if-color-accent); }
.theme-menu-icon {
  display: block; width: 11px; height: 11px; border-radius: 50%;
  border: 2px solid currentColor; position: relative; flex-shrink: 0;
}
.theme-menu-icon::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 3px; height: 3px; border-radius: 50%; background: currentColor;
}
.theme-menu-dropdown {
  display: none; position: absolute; top: calc(100% + 6px); right: 0;
  background: var(--if-color-surface); border: 1px solid var(--if-color-border-strong);
  border-radius: var(--if-radius-sm); box-shadow: var(--if-shadow-md);
  min-width: 130px; overflow: hidden; z-index: 100;
}
.theme-menu-wrap.open .theme-menu-dropdown { display: block; }
.theme-menu-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 12px; font-size: 12px; font-weight: 500;
  border: none; background: none; color: var(--if-color-text-muted);
  cursor: pointer; font-family: var(--font); text-align: left;
  transition: background var(--if-duration-fast), color var(--if-duration-fast);
}
.theme-menu-item:hover { background: var(--if-color-surface-soft); color: var(--if-color-text); }
.theme-menu-item.active { color: var(--if-color-text); font-weight: 600; }
.theme-menu-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid var(--if-color-border-strong);
}
.theme-menu-item.active .theme-menu-dot { background: var(--if-color-accent); border-color: var(--if-color-accent); }

.header { width: 100%; max-width: 640px; margin-bottom: 14px; padding: 0 16px; }
.header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 3px; }
.header p { font-size: 13px; color: var(--text-muted); line-height: 1.55; }

.progress-bar { width: 100%; max-width: 640px; margin-bottom: 12px; padding: 0 16px; }
.progress-label { display: flex; justify-content: space-between; font-size: 11px; }
.progress-label .section-name { color: var(--text-muted); font-weight: 500; }
.progress-label .pct { color: var(--text-dim); }

.card { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 28px; box-shadow: var(--shadow-sm); margin: 0 16px; }

.wizard-section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; display: inline-flex; align-items: center; gap: 5px; }
.wizard-section-label::before { content: ''; display: block; width: 2px; height: 10px; background: var(--accent); border-radius: 1px; }

.section-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
.section-tag::before { content: ''; display: block; width: 2px; height: 10px; background: var(--accent); border-radius: 1px; }
.section-header { margin-bottom: 18px; }
.section-header h2 { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.section-header p { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

.question { margin-bottom: 16px; }
.question:last-of-type { margin-bottom: 0; }
.question-label { display: flex; align-items: baseline; gap: 5px; margin-bottom: 5px; }
.question-label label { font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--text); flex: 1; }
.question-label label.req::after { content: ' *'; color: var(--accent); font-weight: 700; }
.optional-badge { font-size: 10px; color: var(--text-dim); flex-shrink: 0; }
.question-hint { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.5; }

textarea, input[type="text"] {
  width: 100%; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); color: var(--text); font-family: var(--font);
  font-size: 13px; padding: 8px 10px; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s; resize: vertical;
}
textarea:focus, input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--if-color-accent-ring); }
textarea { min-height: 64px; line-height: 1.5; }
.char-counter { text-align: right; font-size: 10px; color: var(--text-dim); margin-top: 3px; }
.char-counter.near { color: var(--warning); }

.radio-group, .checkbox-group { display: flex; flex-direction: column; gap: 4px; }
.choice-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer;
  transition: border-color 0.12s, background 0.12s; user-select: none;
  position: relative;
}
.choice-item .choice-text { min-width: 0; }
.choice-item:hover { border-color: var(--border-strong); background: var(--if-color-surface); }
.choice-item.selected,
.choice-item:has(input:checked) { border-color: var(--accent); background: var(--accent-muted); }
.choice-item.unsure { border-style: dashed; }
.choice-item.unsure.selected,
.choice-item.unsure:has(input:checked) { border-style: solid; }
.choice-item:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Native input visually hidden but functional (kept for accessibility / form semantics) */
.choice-item input[type="radio"],
.choice-item input[type="checkbox"] {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; margin: 0;
}

.choice-dot, .choice-check { pointer-events: none; }
.choice-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--border-strong); flex-shrink: 0; margin-top: 1px; transition: all 0.12s; position: relative; }
.choice-item.selected .choice-dot,
.choice-item:has(input:checked) .choice-dot { border-color: var(--accent); background: var(--accent); }
.choice-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 5px; height: 5px; border-radius: 50%; background: white; opacity: 0; }
.choice-item.selected .choice-dot::after,
.choice-item:has(input:checked) .choice-dot::after { opacity: 1; }

.choice-check { width: 15px; height: 15px; border-radius: 3px; border: 2px solid var(--border-strong); flex-shrink: 0; margin-top: 1px; transition: all 0.12s; position: relative; }
.choice-item.selected .choice-check,
.choice-item:has(input:checked) .choice-check { border-color: var(--accent); background: var(--accent); }
.choice-check::after { content: '\2713'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-52%); font-size: 9px; color: var(--if-color-on-accent); font-weight: 700; opacity: 0; line-height: 1; }
.choice-item.selected .choice-check::after,
.choice-item:has(input:checked) .choice-check::after { opacity: 1; }

.choice-text { flex: 1; }
.choice-text strong { font-size: 13px; font-weight: 600; display: block; color: var(--text); line-height: 1.3; }
.choice-text span { font-size: 11px; color: var(--text-muted); line-height: 1.4; display: block; margin-top: 1px; }
.choice-item.unsure .choice-text strong { color: var(--text-muted); font-weight: 500; font-style: italic; }

.badge-inferred { display: table; font-size: 9px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); background: var(--accent-muted2); border: 1px solid var(--if-color-accent-border); border-radius: 3px; padding: 2px 6px; margin-top: 4px; line-height: 1.4; }

.scale-row { display: flex; gap: 5px; }
.scale-labels { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; color: var(--text-dim); }
.scale-btn { flex: 1; padding: 8px 4px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.12s; text-align: center; font-family: var(--font); }
.scale-btn:hover { border-color: var(--border-strong); background: var(--if-color-surface); }
.scale-btn.active { background: var(--accent); border-color: var(--accent); color: var(--if-color-on-accent); }

/* Priority rank */
.priority-rank-list { display: flex; flex-direction: column; gap: var(--if-space-2); }
.priority-rank-item {
  display: flex; align-items: center; gap: var(--if-space-3);
  padding: calc(var(--if-space-2) * var(--if-density)) calc(var(--if-space-3) * var(--if-density));
  background: var(--if-color-surface-soft); border: 1px solid var(--if-color-border);
  border-radius: var(--if-radius-sm); cursor: grab; user-select: none;
  transition: border-color var(--if-duration-fast) var(--if-ease-out-quart),
              background var(--if-duration-fast) var(--if-ease-out-quart),
              opacity var(--if-duration-fast) var(--if-ease-out-quart);
}
.priority-rank-item:focus-visible { outline: 2px solid var(--if-color-accent); outline-offset: 2px; }
.priority-rank-item:hover { border-color: var(--if-color-border-strong); background: var(--if-color-surface); }
.priority-rank-item.dragging { opacity: 0.4; cursor: grabbing; }
.priority-rank-item.drag-over { border-color: var(--if-color-accent); background: var(--if-color-accent-soft); }
.priority-rank-number {
  font-size: var(--if-text-sm); font-weight: var(--if-weight-bold); color: var(--if-color-accent);
  min-width: 1.25em; text-align: center; flex-shrink: 0; line-height: 1;
}
.priority-rank-handle { position: relative; width: 10px; height: 16px; flex-shrink: 0; }
.priority-rank-handle::before,
.priority-rank-handle::after {
  content: ''; position: absolute; top: 2px; width: 3px; height: 3px;
  border-radius: 50%; background: var(--if-color-text-dim);
  box-shadow: 0 5px 0 var(--if-color-text-dim), 0 10px 0 var(--if-color-text-dim);
}
.priority-rank-handle::before { left: 0; }
.priority-rank-handle::after  { left: 6px; }
.priority-rank-text { flex: 1; min-width: 0; }
.priority-rank-text strong { font-size: var(--if-text-base); font-weight: var(--if-weight-semibold); color: var(--if-color-text); display: block; line-height: var(--if-leading-snug); }
.priority-rank-text span { font-size: var(--if-text-xs); color: var(--if-color-text-muted); display: block; margin-top: 1px; }
.priority-rank-moves { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.priority-rank-move {
  width: 24px; height: 24px; border: 1px solid var(--if-color-border); border-radius: var(--if-radius-xs);
  background: var(--if-color-surface); color: var(--if-color-text-muted);
  font-size: var(--if-text-sm); cursor: pointer; display: flex; align-items: center;
  justify-content: center; padding: 0; line-height: 1;
  transition: border-color var(--if-duration-fast) var(--if-ease-out-quart),
              color var(--if-duration-fast) var(--if-ease-out-quart);
}
.priority-rank-move:hover:not(:disabled) { border-color: var(--if-color-accent); color: var(--if-color-accent); }
.priority-rank-move:disabled { opacity: 0.25; cursor: not-allowed; }

/* Slider */
.slider-wrap { display: flex; flex-direction: column; gap: var(--if-space-2); }
.slider-row { display: flex; align-items: center; gap: var(--if-space-3); }
.slider-value {
  font-size: var(--if-text-sm); font-weight: var(--if-weight-semibold);
  color: var(--if-color-accent); min-width: 3ch; text-align: right; flex-shrink: 0;
  transition: color var(--if-duration-fast) var(--if-ease-out-quart);
}
.slider-input {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer;
  border: none; padding: 0;
}
.slider-input:focus-visible { outline: 2px solid var(--if-color-accent); outline-offset: 4px; border-radius: 3px; }
.slider-input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--if-color-accent); border: 2px solid var(--if-color-surface);
  box-shadow: 0 1px 4px oklch(0% 0 0 / 0.18); cursor: pointer;
  transition: transform var(--if-duration-fast) var(--if-ease-out-quart),
              box-shadow var(--if-duration-fast) var(--if-ease-out-quart);
}
.slider-input:hover::-webkit-slider-thumb { transform: scale(1.15); box-shadow: 0 2px 8px oklch(0% 0 0 / 0.22); }
.slider-input:active::-webkit-slider-thumb { transform: scale(0.95); }
.slider-input::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--if-color-accent); border: 2px solid var(--if-color-surface);
  box-shadow: 0 1px 4px oklch(0% 0 0 / 0.18); cursor: pointer;
  transition: transform var(--if-duration-fast) var(--if-ease-out-quart),
              box-shadow var(--if-duration-fast) var(--if-ease-out-quart);
}
.slider-input:hover::-moz-range-thumb { transform: scale(1.15); box-shadow: 0 2px 8px oklch(0% 0 0 / 0.22); }
.slider-input:active::-moz-range-thumb { transform: scale(0.95); }
.slider-anchors { position: relative; height: 1.4em; margin: 0 10px; }
.slider-anchor {
  position: absolute; transform: translateX(-50%);
  font-size: var(--if-text-xs); color: var(--if-color-text-dim); white-space: nowrap;
  transition: color var(--if-duration-fast) var(--if-ease-out-quart),
              transform var(--if-duration-fast) var(--if-ease-out-quart);
}
.slider-anchor.active { color: var(--if-color-accent); font-weight: var(--if-weight-semibold); transform: translateX(-50%) translateY(-2px); }

/* Segmented toggle */
.segmented-group {
  display: flex; flex-wrap: wrap; gap: 0;
  border: 1px solid var(--if-color-border); border-radius: var(--if-radius-sm);
  overflow: hidden; width: 100%;
}
.segmented-btn {
  flex: 1 1 auto; padding: calc(var(--if-space-2) * var(--if-density)) calc(var(--if-space-4) * var(--if-density));
  border: none; border-right: 1px solid var(--if-color-border);
  background: var(--if-color-surface); color: var(--if-color-text-muted);
  font-family: var(--if-font-ui); font-size: var(--if-text-sm); font-weight: var(--if-weight-medium);
  cursor: pointer; white-space: nowrap; text-align: center; line-height: var(--if-leading-snug);
  transition: background var(--if-duration-fast) var(--if-ease-out-quart),
              color var(--if-duration-fast) var(--if-ease-out-quart),
              border-color var(--if-duration-fast) var(--if-ease-out-quart);
}
.segmented-btn:last-child { border-right: none; }
.segmented-btn:hover:not(.active) { background: var(--if-color-surface-soft); color: var(--if-color-text); }
.segmented-btn.active {
  background: var(--if-color-accent); color: var(--if-color-surface);
  font-weight: var(--if-weight-semibold);
}
.segmented-btn:focus-visible { outline: 2px solid var(--if-color-accent); outline-offset: -2px; z-index: 1; position: relative; }

/* File upload */
.file-upload-zone {
  border: 2px dashed var(--if-color-border); border-radius: var(--if-radius-sm);
  padding: calc(var(--if-space-6) * var(--if-density)) var(--if-space-4);
  text-align: center; cursor: pointer;
  transition: border-color var(--if-duration-fast) var(--if-ease-out-quart),
              background var(--if-duration-fast) var(--if-ease-out-quart);
}
.file-upload-zone:hover { border-color: var(--if-color-accent); background: var(--if-color-accent-soft); }
.file-upload-zone.drag-active { border-color: var(--if-color-accent); background: var(--if-color-accent-soft); }
.file-upload-zone:focus-visible { outline: 2px solid var(--if-color-accent); outline-offset: 2px; }
.file-upload-icon {
  width: 28px; height: 28px; margin: 0 auto var(--if-space-2);
  position: relative;
}
.file-upload-icon::before {
  content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 18px; height: 3px; border-radius: 1.5px; background: var(--if-color-text-dim);
}
.file-upload-icon::after {
  content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 9px solid transparent; border-right: 9px solid transparent;
  border-bottom: 12px solid var(--if-color-text-dim);
}
.file-upload-zone:hover .file-upload-icon::before,
.file-upload-zone.drag-active .file-upload-icon::before { background: var(--if-color-accent); }
.file-upload-zone:hover .file-upload-icon::after,
.file-upload-zone.drag-active .file-upload-icon::after { border-bottom-color: var(--if-color-accent); }
.file-upload-prompt { font-size: var(--if-text-sm); color: var(--if-color-text-muted); }
.file-upload-prompt strong { color: var(--if-color-accent); font-weight: var(--if-weight-semibold); }
.file-upload-limit { font-size: var(--if-text-xs); color: var(--if-color-text-dim); margin-top: 2px; }
.file-upload-preview {
  display: none; margin-top: var(--if-space-3); padding: var(--if-space-2) var(--if-space-3);
  background: var(--if-color-surface-soft); border: 1px solid var(--if-color-border);
  border-radius: var(--if-radius-xs); text-align: left;
  font-size: var(--if-text-sm); color: var(--if-color-text-muted);
  align-items: center; gap: var(--if-space-2);
}
.file-upload-preview.has-file { display: flex; }
.file-upload-filename { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--if-color-text); font-weight: var(--if-weight-medium); }
.file-upload-size { flex-shrink: 0; font-size: var(--if-text-xs); }
.file-upload-clear {
  flex-shrink: 0; border: none; background: none; cursor: pointer; padding: 2px;
  color: var(--if-color-text-dim); font-size: var(--if-text-sm); line-height: 1;
  transition: color var(--if-duration-fast) var(--if-ease-out-quart);
}
.file-upload-clear:hover { color: var(--if-color-danger); }
.file-upload-error { margin-top: var(--if-space-2); font-size: var(--if-text-xs); color: var(--if-color-danger); }

/* Multi-branch conditional */
.branch-conditional { display: none; margin-top: var(--if-space-3); padding-left: var(--if-space-4); border-left: 2px solid var(--if-color-border); }
.branch-conditional.visible { display: block; animation: branch-in var(--if-duration-base) var(--if-ease-out-quart) both; }
@keyframes branch-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

/* Narrative card */
/* Embedded Media */
.embedded-media { margin: 0 0 var(--if-space-2); padding: 0; border: none; }
.embedded-media-asset { display: block; max-width: 100%; height: auto; border-radius: var(--if-radius-sm); background: var(--if-color-surface-soft); }
video.embedded-media-asset { width: 100%; max-height: 360px; }
.embedded-media-caption { margin-top: var(--if-space-2); font-size: var(--if-text-sm); color: var(--if-color-text-muted); font-style: italic; line-height: var(--if-leading-normal); }
.embedded-media-placeholder { display: flex; align-items: center; justify-content: center; min-height: 80px; border-radius: var(--if-radius-sm); background: var(--if-color-surface-soft); border: 1px dashed var(--if-color-border-strong); color: var(--if-color-text-dim); font-size: var(--if-text-sm); }

/* Narrative Card */
.narrative-card {
  padding: calc(var(--if-space-4) * var(--if-density)) var(--if-space-4);
  background: var(--if-color-surface-soft); border-radius: var(--if-radius-sm);
  border-left: 3px solid var(--if-color-accent);
  margin-bottom: var(--if-space-2);
}
.narrative-card-icon { font-size: calc(1.4em * var(--if-density)); line-height: 1; margin-bottom: var(--if-space-1); }
.narrative-card-title {
  font-size: var(--if-text-base); font-weight: var(--if-weight-semibold);
  color: var(--if-color-text); margin-bottom: 4px; line-height: var(--if-leading-snug);
}
.narrative-card-body {
  font-size: var(--if-text-sm); color: var(--if-color-text-muted); line-height: var(--if-leading-normal);
  font-style: italic;
}

.conditional { display: none; }
.conditional.visible { display: block; margin-top: 8px; }
.other-field { margin-top: 6px; display: none; }
.other-field.visible { display: block; }

.commentary { margin-top: 6px; }
.commentary-input {
  /* Roomier by default: a one-line box signals 'not expected', and commentary
     is the highest-signal field in the export. */
  width: 100%; min-height: 64px; padding: 9px 11px;
  background: transparent; border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm); color: var(--text);
  font-family: var(--font); font-size: 12px; line-height: 1.5;
  outline: none; resize: none; overflow: hidden;
  transition: border-color 0.15s, background 0.15s;
}
.commentary-input::placeholder { color: var(--text-dim); font-style: italic; }
.commentary-input:hover { border-color: var(--accent); }
.commentary-input:focus { border-style: solid; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--if-color-accent-ring); }

.inference-box { background: var(--info-bg); border: 1px solid var(--info-border); border-radius: var(--radius-sm); padding: 10px 13px; margin-bottom: 14px; font-size: 12px; color: var(--info-text); line-height: 1.55; }
.inference-box strong { font-weight: 600; }

.divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }
.btn { padding: 8px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.12s; font-family: var(--font); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border-strong); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-muted); }
.btn-primary { background: var(--accent); color: var(--if-color-on-accent); }
.btn-primary:hover { background: var(--accent-hover); }

.review-section { margin-bottom: 14px; }
.review-section-title { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
.review-section-title::before { content: ''; display: block; width: 2px; height: 9px; background: var(--accent); border-radius: 1px; }
.review-item { display: flex; flex-direction: column; gap: 1px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.review-item:last-child { border-bottom: none; }
.review-q { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.review-a { font-size: 13px; color: var(--text); line-height: 1.4; }
.review-a.empty { color: var(--text-dim); font-style: italic; }

.export-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; font-family: var(--mono); font-size: 11px; color: var(--text); line-height: 1.65; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; margin-bottom: 10px; }
.export-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy-feedback { font-size: 12px; color: var(--success); opacity: 0; transition: opacity 0.3s; font-weight: 500; }
.copy-feedback.visible { opacity: 1; }

.wizard-question { display: none; }
.wizard-question.active { display: block; }

#layout-grouped { display: none; }
/* All-sections view: every section visible in one continuous scroll.
   The former .section-tabs strip was removed -- it showed one section at a time
   despite its label, and wrapped/clipped past ~7 sections. */
.grouped-section { display: block; margin-bottom: 30px; }
.grouped-section:last-child { margin-bottom: 0; }
.grouped-section-head {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 14px; padding-bottom: 7px;
  border-bottom: 1px solid var(--border);
}

.fade-in { animation: fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

/* ─────────────────────────────────────────────────────────────
   Shell + sidebar table of contents
   ───────────────────────────────────────────────────────────── */
.if-shell { display: flex; align-items: flex-start; justify-content: center; gap: 28px; width: 100%; }
.if-main { display: flex; flex-direction: column; align-items: center; flex: 0 1 auto; min-width: 0; }

.if-sidebar {
  position: sticky; top: 64px;
  width: 232px; flex: 0 0 232px;
  max-height: calc(100vh - 88px);
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 12px;
  box-shadow: var(--shadow-sm);
}
.toc { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.toc-group { margin-bottom: 14px; }
.toc-group:last-child { margin-bottom: 0; }
.toc-section {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--text-muted); padding: 0 6px 5px;
}
.toc-count { font-size: 10px; font-weight: 600; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.toc-item {
  display: flex; align-items: flex-start; gap: 7px; width: 100%;
  padding: 5px 6px; border: none; background: none; cursor: pointer;
  border-radius: var(--radius-sm); text-align: left;
  font-family: var(--font); font-size: 12px; line-height: 1.35; color: var(--text-muted);
  border-left: 2px solid transparent; transition: background 0.12s, color 0.12s;
}
.toc-item:hover { background: var(--accent-muted); color: var(--text); }
.toc-item.current { background: var(--accent-muted); color: var(--accent); font-weight: 600; border-left-color: var(--accent); }
.toc-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.toc-mark { flex: 0 0 auto; width: 12px; font-size: 11px; line-height: 1.5; }
.toc-item.is-answered .toc-mark { color: var(--success); }
.toc-item.is-skipped  .toc-mark { color: var(--text-dim); }
.toc-item.is-skipped  .toc-item-label { opacity: 0.6; }
.toc-item-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.toc-flag { flex: 0 0 auto; color: var(--warning); font-size: 11px; }
.toc-footer { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.toc-critique-btn, .toc-review-btn {
  width: 100%; padding: 7px 9px; border-radius: var(--radius-sm);
  font-family: var(--font); font-size: 11.5px; font-weight: 600; cursor: pointer;
  text-align: left; border: 1px solid var(--border-strong);
  background: var(--if-color-surface); color: var(--text-muted); transition: all 0.12s;
}
.toc-critique-btn:hover, .toc-review-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-muted); }
.toc-critique-btn.active { border-color: var(--warning); color: var(--warning); background: var(--if-color-surface); }

@media (max-width: 1100px) {
  .if-sidebar { display: none; }
  .if-shell { gap: 0; }
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ─────────────────────────────────────────────────────────────
   Skip + flag controls
   ───────────────────────────────────────────────────────────── */
.question-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.skip-control { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.skip-btn, .flag-btn {
  padding: 4px 10px; border-radius: 999px; cursor: pointer;
  font-family: var(--font); font-size: 11px; font-weight: 600;
  background: none; border: 1px dashed var(--border-strong); color: var(--text-dim);
  transition: all 0.12s;
}
.skip-btn:hover, .flag-btn:hover { border-color: var(--accent); color: var(--accent); }
.skip-btn[aria-pressed="true"] { border-style: solid; border-color: var(--text-muted); color: var(--text-muted); background: var(--surface2); }
.skip-reasons { display: none; align-items: center; flex-wrap: wrap; gap: 5px; }
.skip-reasons.visible { display: flex; }
.skip-reasons-label { font-size: 10.5px; color: var(--text-dim); font-weight: 600; }
.skip-reason-btn {
  padding: 3px 9px; border-radius: 999px; cursor: pointer;
  font-family: var(--font); font-size: 10.5px; font-weight: 500;
  background: none; border: 1px solid var(--border); color: var(--text-muted); transition: all 0.12s;
}
.skip-reason-btn:hover { border-color: var(--accent); color: var(--accent); }
.skip-reason-btn.active { background: var(--accent); border-color: var(--accent); color: var(--if-color-on-accent); font-weight: 600; }

.question.is-skipped > .radio-group,
.question.is-skipped > .checkbox-group,
.question.is-skipped > div > .scale-row,
.question.is-skipped > .commentary { opacity: 0.45; }
.question.is-flagged { border-left: 2px solid var(--warning); padding-left: 12px; margin-left: -14px; }

.flag-panel { display: none; margin-top: 9px; padding: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.flag-panel.visible { display: block; }
.flag-kinds { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
.flag-kind-btn {
  padding: 4px 10px; border-radius: 999px; cursor: pointer;
  font-family: var(--font); font-size: 11px; font-weight: 500;
  background: var(--if-color-surface); border: 1px solid var(--border); color: var(--text-muted); transition: all 0.12s;
}
.flag-kind-btn:hover { border-color: var(--warning); color: var(--warning); }
.flag-kind-btn.active { background: var(--warning); border-color: var(--warning); color: var(--if-color-surface); font-weight: 600; }
.flag-note {
  width: 100%; min-height: 48px; padding: 8px 10px;
  background: var(--if-color-surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text);
  font-family: var(--font); font-size: 12px; line-height: 1.5; outline: none; resize: vertical;
}
.flag-note:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--if-color-accent-ring); }

/* ─────────────────────────────────────────────────────────────
   Labeled scale (fully labeled points beat endpoint-only anchors)
   ───────────────────────────────────────────────────────────── */
.scale-row-labeled { display: flex; gap: 6px; align-items: stretch; }
.scale-row-labeled .scale-btn {
  flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: 3px; height: auto; min-height: 54px; padding: 7px 4px; width: auto;
}
.scale-btn-num { font-size: 13px; font-weight: 700; line-height: 1; }
.scale-btn-label { font-size: 10px; font-weight: 500; line-height: 1.25; text-align: center; opacity: 0.85; }
.scale-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ─────────────────────────────────────────────────────────────
   Review "Change" affordance
   ───────────────────────────────────────────────────────────── */
.review-item { position: relative; }
.review-change {
  position: absolute; top: 6px; right: 0;
  padding: 2px 9px; border-radius: 999px; cursor: pointer;
  font-family: var(--font); font-size: 10.5px; font-weight: 600;
  background: none; border: 1px solid var(--border-strong); color: var(--text-muted); transition: all 0.12s;
}
.review-change:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-muted); }

/* ─────────────────────────────────────────────────────────────
   Form critique panel
   ───────────────────────────────────────────────────────────── */
.critique-overlay {
  display: none; position: fixed; inset: 0; z-index: 90;
  background: oklch(20% 0.02 var(--if-hue, 235) / 0.42);
  align-items: center; justify-content: center; padding: 24px;
}
.critique-overlay.visible { display: flex; }
.critique-card {
  width: 100%; max-width: 520px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px 24px; box-shadow: 0 18px 48px oklch(20% 0.02 var(--if-hue, 235) / 0.22);
}
.critique-title { font-family: var(--if-font-display, var(--font)); font-size: 17px; font-weight: 700; color: var(--text); margin: 0 0 6px; letter-spacing: -0.01em; }
.critique-sub { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; margin: 0 0 15px; }
.critique-kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 13px; }
.critique-kind-btn {
  padding: 6px 12px; border-radius: 999px; cursor: pointer;
  font-family: var(--font); font-size: 12px; font-weight: 500;
  background: var(--if-color-surface); border: 1px solid var(--border-strong); color: var(--text-muted); transition: all 0.12s;
}
.critique-kind-btn:hover { border-color: var(--accent); color: var(--accent); }
.critique-kind-btn.active { background: var(--accent); border-color: var(--accent); color: var(--if-color-on-accent); font-weight: 600; }
.critique-note {
  width: 100%; padding: 10px 12px; background: var(--if-color-surface);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text);
  font-family: var(--font); font-size: 13px; line-height: 1.55; outline: none; resize: vertical;
}
.critique-note:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--if-color-accent-ring); }
.critique-actions { display: flex; gap: 8px; margin-top: 14px; }

.question.flash { animation: flashHighlight 0.9s ease; }
@keyframes flashHighlight {
  0%, 100% { background: transparent; }
  30%      { background: var(--accent-muted); }
}

/* ─────────────────────────────────────────────────────────────
   Cited materials (always open in a new tab)
   ───────────────────────────────────────────────────────────── */
.sources { margin: 9px 0 12px; padding: 9px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.sources-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; }
.sources-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.sources-list li { font-size: 12px; line-height: 1.45; color: var(--text-muted); }
.source-link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
.source-link:hover { text-decoration-thickness: 2px; }
.source-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.source-link::after { content: ' ↗'; font-size: 10px; opacity: 0.7; text-decoration: none; display: inline-block; }
.source-note { color: var(--text-dim); font-size: 11.5px; }
.header .sources { margin-top: 12px; }

/* Mobile-only critique escape hatch (sidebar is hidden below 1100px). */
.critique-fab { display: none; }
@media (max-width: 1100px) {
  .critique-fab {
    display: block; position: fixed; right: 14px; bottom: 14px; z-index: 80;
    padding: 9px 15px; border-radius: 999px; cursor: pointer;
    font-family: var(--font); font-size: 12px; font-weight: 600;

    border: 1px solid var(--border-strong);
    box-shadow: 0 4px 14px oklch(20% 0.02 var(--if-hue, 235) / 0.18);
  }
  .critique-fab:hover, .critique-fab:focus-visible { border-color: var(--accent); color: var(--accent); }
}

<script>
/* intake-form runtime — single-source-of-truth renderer
 *
 * The form HTML contains a single <script id="form-spec" type="application/json"> block.
 * On DOMContentLoaded this file:
 *   1. Reads the spec
 *   2. Builds BOTH the wizard layout and the grouped layout from it
 *   3. Wires native <input> form controls and syncs state across layouts
 *
 * Agents authoring forms only edit the spec block — never the layout HTML.
 */

(function () {
  'use strict';

  // ── Module state ──
  var state = {};
  var checkboxSets = {};
  var skipped = {};        // qId -> { reason: string }  — explicit skips (see § Skip)
  var flags = {};          // qId -> { kind: string, note: string } — per-question meta-feedback
  var formCritique = {};   // form-level meta-feedback: { kinds: [], note: '' }
  var currentQ = 1;
  var TOTAL_Q = 1;
  var SECTION_NAMES = ['Review'];
  var STEPS = [];          // flattened [{section, sectionIdx, question}] — drives the TOC
  var SPEC = null;

  // Expose for inline handlers in template + custom export functions.
  window.state = state;
  window.checkboxSets = checkboxSets;
  window.skipped = skipped;
  window.flags = flags;

  // Skip reasons. The distinction matters: "not applicable" and "don't know" are
  // different signals to the consuming agent, and collapsing them loses information.
  var SKIP_REASONS = [
    { value: 'not_applicable', label: "Doesn't apply" },
    { value: 'dont_know',      label: "Don't know" },
    { value: 'prefer_not',     label: 'Prefer not to say' }
  ];

  // Form-level critique options — the "you're asking the wrong questions" escape hatch.
  var CRITIQUE_KINDS = [
    { value: 'wrong_level',     label: 'Wrong level of detail' },
    { value: 'too_specific',    label: 'Too specific / in the weeds' },
    { value: 'underspecified',  label: 'Too vague to answer' },
    { value: 'missing_topic',   label: 'Missing the real question' },
    { value: 'irrelevant',      label: 'Not relevant to this work' }
  ];

  // ── Entry point ──
  document.addEventListener('DOMContentLoaded', function () {
    var specEl = document.getElementById('form-spec');
    if (!specEl) {
      console.error('intake-form: <script id="form-spec"> not found');
      return;
    }
    try {
      SPEC = JSON.parse(specEl.textContent);
    } catch (e) {
      console.error('intake-form: spec JSON parse error', e);
      return;
    }
    applyTheme(SPEC);
    renderForm(SPEC);
    setLayout('wizard');
    updateProgress();
  });

  // ── Theme application ──
  // themeToCSSProps is a pure function: spec.theme -> { props, dataset, warns }.
  // applyTheme wires it onto <html> + emits warnings via console.warn.
  // Pure split exists so the verification harness can test theme translation
  // without driving a real DOM.
  var PALETTE_MAP = {
    accent:           '--if-color-accent',
    'accent-hover':   '--if-color-accent-hover',
    'accent-soft':    '--if-color-accent-soft',
    'accent-soft2':   '--if-color-accent-soft2',
    bg:               '--if-color-bg',
    surface:          '--if-color-surface',
    'surface-soft':   '--if-color-surface-soft',
    border:           '--if-color-border',
    'border-strong':  '--if-color-border-strong',
    text:             '--if-color-text',
    'text-muted':     '--if-color-text-muted',
    'text-dim':       '--if-color-text-dim',
    success:          '--if-color-success',
    warning:          '--if-color-warning',
    danger:           '--if-color-danger'
  };
  var FONT_MAP = {
    sans:  'var(--if-font-sans)',
    serif: 'var(--if-font-serif)',
    mono:  'var(--if-font-mono)'
  };
  var MOTION_PRESETS = {
    off:        { fast: '1ms',   base: '1ms',   slow: '1ms' },
    subtle:     { fast: '80ms',  base: '120ms', slow: '180ms' },
    default:    { fast: '120ms', base: '180ms', slow: '280ms' },
    expressive: { fast: '180ms', base: '260ms', slow: '420ms' }
  };
  var CURVE_MAP = {
    quart: 'cubic-bezier(0.25, 1, 0.5, 1)',
    quint: 'cubic-bezier(0.22, 1, 0.36, 1)',
    expo:  'cubic-bezier(0.16, 1, 0.3, 1)'
  };
  var DENSITY_MAP = { compact: 0.85, default: 1, airy: 1.15 };

  function themeToCSSProps(theme) {
    var props = {};
    var dataset = {};
    var warns = [];
    if (!theme || typeof theme !== 'object') return { props: props, dataset: dataset, warns: warns };

    if (theme.preset) dataset.theme = String(theme.preset);

    if (theme.hue != null) {
      var hue = Number(theme.hue);
      if (isFinite(hue)) props['--if-hue'] = String(((hue % 360) + 360) % 360);
      else warns.push('theme.hue: not a finite number (got ' + JSON.stringify(theme.hue) + ')');
    }

    if (theme.palette && typeof theme.palette === 'object') {
      Object.keys(theme.palette).forEach(function (k) {
        var tok = PALETTE_MAP[k];
        var v = theme.palette[k];
        if (!tok) warns.push('theme.palette: unknown key "' + k + '" (valid keys: ' + Object.keys(PALETTE_MAP).join(', ') + ')');
        else if (typeof v !== 'string') warns.push('theme.palette.' + k + ': not a string');
        else props[tok] = v;
      });
    }

    if (theme.typography && typeof theme.typography === 'object') {
      var ty = theme.typography;
      if (ty.display != null) {
        if (FONT_MAP[ty.display]) props['--if-font-display'] = FONT_MAP[ty.display];
        else warns.push('theme.typography.display: unknown value "' + ty.display + '" (valid: sans, serif, mono)');
      }
      if (ty.body != null) {
        if (FONT_MAP[ty.body]) {
          props['--if-font-body'] = FONT_MAP[ty.body];
          props['--if-font-sans'] = FONT_MAP[ty.body];
        } else warns.push('theme.typography.body: unknown value "' + ty.body + '" (valid: sans, serif, mono)');
      }
      if (ty.scale != null) {
        if (typeof ty.scale === 'number' && isFinite(ty.scale)) {
          var s = Math.max(0.85, Math.min(1.3, ty.scale));
          if (s !== ty.scale) warns.push('theme.typography.scale: clamped from ' + ty.scale + ' to ' + s);
          props['--if-type-scale'] = String(s);
        } else warns.push('theme.typography.scale: not a finite number (got ' + JSON.stringify(ty.scale) + ')');
      }
    }

    if (theme.motion && typeof theme.motion === 'object') {
      if (theme.motion.intensity != null) {
        var m = MOTION_PRESETS[theme.motion.intensity];
        if (m) {
          props['--if-duration-fast'] = m.fast;
          props['--if-duration-base'] = m.base;
          props['--if-duration-slow'] = m.slow;
        } else warns.push('theme.motion.intensity: unknown value "' + theme.motion.intensity + '" (valid: off, subtle, default, expressive)');
      }
      if (theme.motion.curve != null) {
        if (CURVE_MAP[theme.motion.curve]) props['--if-ease-out-primary'] = CURVE_MAP[theme.motion.curve];
        else warns.push('theme.motion.curve: unknown value "' + theme.motion.curve + '" (valid: quart, quint, expo)');
      }
    }

    if (theme.density != null) {
      var d = typeof theme.density === 'number' ? theme.density : DENSITY_MAP[theme.density];
      if (typeof d === 'number' && isFinite(d)) {
        var clamped = Math.max(0.7, Math.min(1.4, d));
        if (clamped !== d) warns.push('theme.density: clamped from ' + d + ' to ' + clamped);
        props['--if-density'] = String(clamped);
      } else warns.push('theme.density: unrecognized value ' + JSON.stringify(theme.density) + ' (valid: compact, default, airy, or 0.7–1.4 number)');
    }

    if (theme.voice) dataset.voice = String(theme.voice);

    return { props: props, dataset: dataset, warns: warns };
  }

  function applyTheme(spec) {
    if (!spec || !spec.theme) return;
    var result = themeToCSSProps(spec.theme);
    var root = document.documentElement;
    Object.keys(result.props).forEach(function (k) { root.style.setProperty(k, result.props[k]); });
    Object.keys(result.dataset).forEach(function (k) { root.dataset[k] = result.dataset[k]; });
    result.warns.forEach(function (w) { console.warn('intake-form theme:', w); });
  }

  // ── Theme switcher ──
  var THEME_PRESETS = [
    { value: 'default',   label: 'Default' },
    { value: 'editorial', label: 'Editorial' },
    { value: 'terminal',  label: 'Terminal' }
  ];

  function buildThemeMenu() {
    var wrap = document.createElement('div');
    wrap.className = 'theme-menu-wrap';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'theme-menu-btn';
    btn.setAttribute('aria-haspopup', 'true');
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-label', 'Switch theme');
    btn.innerHTML = '<span class="theme-menu-icon" aria-hidden="true"></span>Theme';
    wrap.appendChild(btn);

    var dropdown = document.createElement('div');
    dropdown.className = 'theme-menu-dropdown';
    dropdown.setAttribute('role', 'menu');

    THEME_PRESETS.forEach(function (preset) {
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'theme-menu-item';
      item.setAttribute('role', 'menuitem');
      item.dataset.preset = preset.value;
      var dot = document.createElement('span');
      dot.className = 'theme-menu-dot';
      dot.setAttribute('aria-hidden', 'true');
      item.appendChild(dot);
      item.appendChild(document.createTextNode(preset.label));
      item.addEventListener('click', function () {
        switchPreset(preset.value);
        closeMenu();
      });
      dropdown.appendChild(item);
    });
    wrap.appendChild(dropdown);

    function openMenu() {
      wrap.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      var current = document.documentElement.dataset.theme || 'default';
      dropdown.querySelectorAll('.theme-menu-item').forEach(function (el) {
        el.classList.toggle('active', el.dataset.preset === current);
      });
    }
    function closeMenu() {
      wrap.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      wrap.classList.contains('open') ? closeMenu() : openMenu();
    });
    dropdown.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', closeMenu);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });

    return wrap;
  }

  function switchPreset(preset) {
    var root = document.documentElement;
    if (!preset || preset === 'default') delete root.dataset.theme;
    else root.dataset.theme = preset;
  }

  // ── Top-level renderer ──
  function renderForm(spec) {
    document.getElementById('title-slot').textContent = spec.title || 'Intake';
    document.getElementById('topbar-title-slot').textContent = spec.title || '';
    document.getElementById('heading-slot').textContent = spec.heading || '';
    document.getElementById('subhead-slot').textContent = spec.subhead || '';

    if (spec.sources) {
      var hdr = document.querySelector('.header');
      var hsrc = buildSources(spec.sources, spec.sourcesLabel || 'Background material');
      if (hdr && hsrc) hdr.appendChild(hsrc);
    }

    // Inject theme switcher into topbar
    var topbar = document.querySelector('.topbar');
    var toggle = document.getElementById('layout-toggle');
    if (topbar && toggle) {
      var actions = document.createElement('div');
      actions.className = 'topbar-actions';
      topbar.insertBefore(actions, toggle);
      actions.appendChild(toggle);
      actions.appendChild(buildThemeMenu());
    }

    var wizard = document.getElementById('layout-wizard');
    var grouped = document.getElementById('layout-grouped');

    // Flatten questions to wizard steps
    var steps = [];
    spec.sections.forEach(function (sec, sIdx) {
      sec.questions.forEach(function (q) {
        steps.push({ section: sec, sectionIdx: sIdx, question: q });
      });
    });

    TOTAL_Q = steps.length + 1; // +1 for review step
    SECTION_NAMES = steps.map(function (s) { return s.section.name; }).concat(['Review']);

    // Initialize state from spec defaults
    spec.sections.forEach(function (sec) {
      sec.questions.forEach(initStateFromQuestion);
    });

    // ── Build wizard layout ──
    steps.forEach(function (step, idx) {
      var stepNum = idx + 1;
      var isFirst = idx === 0;
      var stepEl = document.createElement('div');
      stepEl.className = 'wizard-question' + (isFirst ? ' active' : '');
      stepEl.id = 'q' + stepNum;

      stepEl.appendChild(buildSectionLabel(step.section.name));
      if (step.question.inferenceBox) {
        stepEl.appendChild(buildInferenceBox(step.question.inferenceBox));
      }
      stepEl.appendChild(buildQuestion(step.question, 'w'));
      stepEl.appendChild(buildNavRow(!isFirst, true, false));
      wizard.appendChild(stepEl);
    });

    // Wizard review step
    var reviewStep = document.createElement('div');
    reviewStep.className = 'wizard-question';
    reviewStep.id = 'q' + TOTAL_Q;
    reviewStep.appendChild(buildSectionLabel('Review'));
    var reviewContent = document.createElement('div');
    reviewContent.id = 'wizard-review-content';
    reviewStep.appendChild(reviewContent);
    reviewStep.appendChild(buildHr());
    reviewStep.appendChild(buildExportBox('export-text', 'copy-fb-w'));
    reviewStep.appendChild(buildNavRow(true, false, true));
    wizard.appendChild(reviewStep);

    // ── Build grouped layout ──
    // "All sections" now means ALL sections, rendered as one continuous scroll.
    // The old tab strip contradicted its own label (it showed one section at a
    // time) and overflowed badly with more than ~7 sections; the sidebar TOC
    // replaces it as the navigation affordance.
    document.getElementById('layout-toggle').hidden = spec.sections.length <= 1;
    spec.sections.forEach(function (sec, sIdx) {
      var secEl = document.createElement('section');
      secEl.className = 'grouped-section';
      secEl.id = 'gs' + sIdx;

      var head = document.createElement('h2');
      head.className = 'grouped-section-head';
      head.textContent = sec.name;
      secEl.appendChild(head);

      sec.questions.forEach(function (q) {
        if (q.inferenceBox) secEl.appendChild(buildInferenceBox(q.inferenceBox));
        secEl.appendChild(buildQuestion(q, 'g'));
      });
      grouped.appendChild(secEl);
    });

    var exportSec = document.createElement('section');
    exportSec.className = 'grouped-section';
    exportSec.id = 'gs' + spec.sections.length;
    var exportHead = document.createElement('h2');
    exportHead.className = 'grouped-section-head';
    exportHead.textContent = 'Review & export';
    exportSec.appendChild(exportHead);
    var groupedReview = document.createElement('div');
    groupedReview.id = 'grouped-review-content';
    exportSec.appendChild(groupedReview);
    exportSec.appendChild(buildHr());
    exportSec.appendChild(buildExportBox('export-text-grouped', 'copy-fb-g'));
    grouped.appendChild(exportSec);

    // ── Sidebar TOC + critique panel ──
    STEPS = steps;
    var shell = document.getElementById('if-shell') || document.body;
    var sidebar = buildSidebar(spec);
    shell.insertBefore(sidebar, shell.firstChild);
    document.body.appendChild(buildCritiquePanel());

    // Mobile fallback: the sidebar (and its critique button) is hidden below
    // 1100px, so the escape hatch would be unreachable exactly where forms feel
    // longest. This floating button appears only in that range.
    var fab = document.createElement('button');
    fab.type = 'button';
    fab.className = 'critique-fab';
    fab.id = 'critique-fab';
    fab.textContent = '⚑ Wrong questions?';
    fab.addEventListener('click', openCritique);
    document.body.appendChild(fab);

    refreshTOC();
  }

  // ── Question builder ──
  function buildQuestion(q, layoutPrefix) {
    var wrap = document.createElement('div');
    wrap.className = 'question';
    wrap.dataset.questionId = q.id;
    wrap.dataset.layout = layoutPrefix;

    var isDisplay = q.type === 'narrative-card' || q.type === 'embedded-media';
    if (q.label && !isDisplay) {
      var lblWrap = document.createElement('div');
      lblWrap.className = 'question-label';
      var lbl = document.createElement('label');
      if (q.required) lbl.className = 'req';
      lbl.textContent = q.label;
      // Associate label with single-input types so axe can find the programmatic relationship
      if (q.type === 'textarea' || q.type === 'text') {
        lbl.htmlFor = 'if-input-' + layoutPrefix + '-' + q.id;
      }
      lblWrap.appendChild(lbl);
      wrap.appendChild(lblWrap);
    }
    if (q.hint && !isDisplay) {
      var hint = document.createElement('div');
      hint.className = 'question-hint';
      hint.textContent = q.hint;
      wrap.appendChild(hint);
    }

    if (q.sources && !isDisplay) {
      var qsrc = buildSources(q.sources, q.sourcesLabel || 'Reference material');
      if (qsrc) wrap.appendChild(qsrc);
    }

    var body;
    switch (q.type) {
      case 'radio':    body = buildRadioGroup(q, layoutPrefix); break;
      case 'checkbox': body = buildCheckboxGroup(q, layoutPrefix); break;
      case 'textarea': body = buildTextarea(q, layoutPrefix); break;
      case 'text':     body = buildTextInput(q, layoutPrefix); break;
      case 'scale':         body = buildScale(q, layoutPrefix); break;
      case 'slider':        body = buildSlider(q, layoutPrefix); break;
      case 'segmented':     body = buildSegmented(q, layoutPrefix); break;
      case 'file-upload':   body = buildFileUpload(q, layoutPrefix); break;
      case 'narrative-card':   body = buildNarrativeCard(q); break;
      case 'embedded-media':   body = buildEmbeddedMedia(q); break;
      case 'priority-rank': body = buildPriorityRank(q, layoutPrefix); break;
      default:
        body = document.createElement('div');
        body.textContent = '[unknown question type: ' + q.type + ']';
    }
    wrap.appendChild(body);

    if (q.conditional) {
      var cond = document.createElement('div');
      cond.className = 'conditional';
      cond.id = layoutPrefix + '-' + q.conditional.id;
      cond.dataset.condFor = q.conditional.id;
      var condInput = q.conditional.type === 'textarea'
        ? buildTextarea({
            id: q.conditional.stateKey || (q.id + '_other'),
            placeholder: q.conditional.placeholder,
            maxLength: q.conditional.maxLength
          }, layoutPrefix)
        : buildTextInput({
            id: q.conditional.stateKey || (q.id + '_other'),
            placeholder: q.conditional.placeholder
          }, layoutPrefix);
      cond.appendChild(condInput);

      // Nothing is pre-selected (R1), so a conditional never starts visible.
      // It reveals on the user's own click via the radio change handler.

      wrap.appendChild(cond);
    }

    if (shouldAddCommentary(q)) {
      wrap.appendChild(buildCommentary(q, layoutPrefix));
    }

    // Skip + flag row. Display-only types have nothing to skip or answer.
    if (!isDisplay) {
      var meta = document.createElement('div');
      meta.className = 'question-meta';
      meta.appendChild(buildSkipControl(q));
      meta.appendChild(buildFlagControl(q));
      wrap.appendChild(meta);
      if (skipped[q.id]) wrap.classList.add('is-skipped');
      if (flags[q.id]) wrap.classList.add('is-flagged');
    }
    return wrap;
  }

  // ── Commentary (auto-attached to non-open-ended questions) ──
  function shouldAddCommentary(q) {
    if (q.type === 'text' || q.type === 'textarea' || q.type === 'narrative-card' || q.type === 'embedded-media') return false;
    if (q.commentary === false) return false;
    if (SPEC && SPEC.commentary === false && q.commentary !== true) return false;
    return true;
  }

  function buildCommentary(q, layoutPrefix) {
    var ckey = q.id + '_commentary';
    var wrap = document.createElement('div');
    wrap.className = 'commentary';

    var ta = document.createElement('textarea');
    ta.className = 'commentary-input';
    ta.rows = 1;
    ta.placeholder = q.commentaryPlaceholder || (SPEC && SPEC.commentaryPlaceholder) || 'Add commentary (optional)';
    ta.maxLength = q.commentaryMaxLength || (SPEC && SPEC.commentaryMaxLength) || 500;
    ta.dataset.qid = ckey;
    ta.dataset.layout = layoutPrefix || '';
    ta.value = state[ckey] || '';
    autoGrow(ta);
    ta.addEventListener('input', function () {
      state[ckey] = ta.value;
      document.querySelectorAll('textarea[data-qid="' + ckey + '"]').forEach(function (t) {
        if (t !== ta) {
          t.value = ta.value;
          autoGrow(t);
        }
      });
      autoGrow(ta);
    });
    wrap.appendChild(ta);
    return wrap;
  }

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight ? ta.scrollHeight : 28) + 'px';
  }

  // Factual questions get an explicit "Not sure" escape hatch, because a user can
  // genuinely not know the answer and a forced guess becomes a false constraint.
  // Judgment questions do not: the user does have a preference, and an escape hatch
  // there invites satisficing (Krosnick et al. 2002). Authors declare intent via
  // q.kind; the renderer applies the rule so nobody has to remember it.
  function resolveOptions(q) {
    var opts = (q.options || []).slice();
    if (q.kind !== 'factual') return opts;
    var hasEscape = opts.some(function (o) { return o.unsure; });
    if (!hasEscape) opts.push({ value: 'not_sure', label: 'Not sure', unsure: true });
    return opts;
  }

  function buildRadioGroup(q, layoutPrefix) {
    var opts = resolveOptions(q);
    var hasBranches = opts.some(function (o) { return o.branch; });
    var group = document.createElement('div');
    group.className = 'radio-group';
    group.setAttribute('role', 'radiogroup');

    opts.forEach(function (opt) {
      var item = document.createElement('label');
      item.className = 'choice-item' + (opt.unsure ? ' unsure' : '');

      var input = document.createElement('input');
      input.type = 'radio';
      input.name = layoutPrefix + '-' + q.id;
      input.value = opt.value;
      // No pre-selection: a waved-through guess is indistinguishable from an
      // endorsed answer in the export, which defeats the point of asking (R1).
      // The agent's hypothesis is surfaced as a badge/inferenceBox instead.
      input.checked = state[q.id] != null && state[q.id] === opt.value;
      input.dataset.qid = q.id;
      input.addEventListener('change', function () {
        if (!input.checked) return;
        state[q.id] = input.value;
        clearSkip(q.id);
        document.querySelectorAll('input[type="radio"][data-qid="' + q.id + '"]').forEach(function (r) {
          r.checked = (r.value === input.value);
        });
        if (q.conditional) {
          var matchOpt = opts.find(function (o) { return o.value === input.value; });
          var show = !!(matchOpt && matchOpt.reveals);
          document.querySelectorAll('[data-cond-for="' + q.conditional.id + '"]').forEach(function (c) {
            c.classList.toggle('visible', show);
          });
        }
        if (hasBranches) {
          document.querySelectorAll('.branch-conditional[data-branch-for^="' + q.id + '__"]').forEach(function (bc) {
            bc.classList.toggle('visible', bc.dataset.branchFor === q.id + '__' + input.value);
          });
        }
      });
      item.appendChild(input);

      var dot = document.createElement('span');
      dot.className = 'choice-dot';
      item.appendChild(dot);

      item.appendChild(buildChoiceText(opt));
      group.appendChild(item);
    });

    if (!hasBranches) return group;

    var wrap = document.createElement('div');
    wrap.appendChild(group);
    opts.forEach(function (opt) {
      if (!opt.branch) return;
      initStateFromQuestion(opt.branch);
      var bc = document.createElement('div');
      bc.className = 'branch-conditional';
      bc.dataset.branchFor = q.id + '__' + opt.value;
      if (state[q.id] === opt.value) bc.classList.add('visible');
      bc.appendChild(buildQuestion(opt.branch, layoutPrefix));
      wrap.appendChild(bc);
    });
    return wrap;
  }

  function buildCheckboxGroup(q, layoutPrefix) {
    var group = document.createElement('div');
    group.className = 'checkbox-group';
    q.options.forEach(function (opt) {
      var item = document.createElement('label');
      item.className = 'choice-item' + (opt.unsure ? ' unsure' : '');

      var input = document.createElement('input');
      input.type = 'checkbox';
      input.name = layoutPrefix + '-' + q.id;
      input.value = opt.value;
      input.checked = (checkboxSets[q.id] || new Set()).has(opt.value);
      input.dataset.qid = q.id;
      input.addEventListener('change', function () {
        clearSkip(q.id);
        // Sync the matching value across layouts
        document.querySelectorAll('input[type="checkbox"][data-qid="' + q.id + '"][value="' + input.value + '"]').forEach(function (c) {
          c.checked = input.checked;
        });
        // Recompute set from any one layout
        var set = new Set();
        document.querySelectorAll('input[type="checkbox"][data-qid="' + q.id + '"][name="w-' + q.id + '"]:checked').forEach(function (c) {
          set.add(c.value);
        });
        // If wizard layout absent (single section), fall back to grouped
        if (!set.size) {
          document.querySelectorAll('input[type="checkbox"][data-qid="' + q.id + '"]:checked').forEach(function (c) {
            set.add(c.value);
          });
        }
        checkboxSets[q.id] = set;
        state[q.id] = Array.from(set);
      });
      item.appendChild(input);

      var check = document.createElement('span');
      check.className = 'choice-check';
      item.appendChild(check);

      item.appendChild(buildChoiceText(opt));
      group.appendChild(item);
    });
    return group;
  }

  function buildChoiceText(opt) {
    var text = document.createElement('div');
    text.className = 'choice-text';
    var strong = document.createElement('strong');
    strong.textContent = opt.label;
    text.appendChild(strong);
    if (opt.description) {
      var span = document.createElement('span');
      span.textContent = opt.description;
      text.appendChild(span);
    }
    if (opt.badge) {
      var badge = document.createElement('div');
      badge.className = 'badge-inferred';
      badge.textContent = opt.badge;
      text.appendChild(badge);
    }
    return text;
  }

  function buildTextarea(q, layoutPrefix) {
    var wrap = document.createElement('div');
    var ta = document.createElement('textarea');
    if (q.maxLength) ta.maxLength = q.maxLength;
    ta.id = 'if-input-' + layoutPrefix + '-' + q.id;
    ta.placeholder = q.placeholder || '';
    ta.dataset.qid = q.id;
    ta.dataset.layout = layoutPrefix || '';
    ta.value = state[q.id] || '';
    var counter = null;
    if (q.maxLength) {
      counter = document.createElement('div');
      counter.className = 'char-counter';
      counter.textContent = (ta.value.length) + ' / ' + q.maxLength;
    }
    ta.addEventListener('input', function () {
      state[q.id] = ta.value;
      // Sync sibling textareas
      document.querySelectorAll('textarea[data-qid="' + q.id + '"]').forEach(function (t) {
        if (t !== ta) t.value = ta.value;
      });
      if (counter) {
        var n = ta.value.length;
        counter.textContent = n + ' / ' + q.maxLength;
        counter.className = 'char-counter' + (n > q.maxLength * 0.85 ? ' near' : '');
      }
    });
    wrap.appendChild(ta);
    if (counter) wrap.appendChild(counter);
    return wrap;
  }

  function buildTextInput(q, layoutPrefix) {
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.id = 'if-input-' + layoutPrefix + '-' + q.id;
    inp.placeholder = q.placeholder || '';
    inp.dataset.qid = q.id;
    inp.dataset.layout = layoutPrefix || '';
    inp.value = state[q.id] || '';
    inp.addEventListener('input', function () {
      state[q.id] = inp.value;
      document.querySelectorAll('input[type="text"][data-qid="' + q.id + '"]').forEach(function (t) {
        if (t !== inp) t.value = inp.value;
      });
    });
    return inp;
  }

  // Scale implements the APG rating-radio-group pattern: role=radiogroup on the
  // container, role=radio + aria-checked per point, roving tabindex, and arrow-key
  // navigation. Plain <button>s pass axe individually but do not announce as a
  // single-choice group, so screen-reader users cannot tell how many points exist
  // or which is selected.
  //
  // q.labels (one string per point) renders a fully labeled scale, which yields
  // higher reliability than endpoint-only anchors. q.anchors stays supported.
  function buildScale(q, layoutPrefix) {
    var wrap = document.createElement('div');
    var points = Array.isArray(q.labels) && q.labels.length ? q.labels.length : (q.points || 5);
    var labeled = Array.isArray(q.labels) && q.labels.length === points;

    var row = document.createElement('div');
    row.className = 'scale-row' + (labeled ? ' scale-row-labeled' : '');
    row.setAttribute('role', 'radiogroup');
    if (q.label) row.setAttribute('aria-label', q.label);

    function select(n) {
      state[q.id] = n;
      clearSkip(q.id);
      document.querySelectorAll('.scale-btn[data-qid="' + q.id + '"]').forEach(function (b) {
        var on = parseInt(b.dataset.scaleVal, 10) === n;
        b.classList.toggle('active', on);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
      });
      refreshTOC();
    }

    for (var i = 1; i <= points; i++) {
      (function (n) {
        var isOn = state[q.id] === n;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'scale-btn' + (isOn ? ' active' : '');
        btn.setAttribute('role', 'radio');
        btn.setAttribute('aria-checked', isOn ? 'true' : 'false');
        // Roving tabindex: with nothing selected the first point is the tab stop.
        btn.tabIndex = isOn || (state[q.id] == null && n === 1) ? 0 : -1;
        btn.dataset.qid = q.id;
        btn.dataset.scaleVal = n;

        if (labeled) {
          var num = document.createElement('span');
          num.className = 'scale-btn-num';
          num.textContent = n;
          btn.appendChild(num);
          var txt = document.createElement('span');
          txt.className = 'scale-btn-label';
          txt.textContent = q.labels[n - 1];
          btn.appendChild(txt);
          btn.setAttribute('aria-label', n + ' — ' + q.labels[n - 1]);
        } else {
          btn.textContent = n;
        }

        btn.addEventListener('click', function () { select(n); });
        btn.addEventListener('keydown', function (e) {
          var delta = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1
                    : e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   ? -1 : 0;
          if (!delta) return;
          e.preventDefault();
