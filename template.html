<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="title-slot">Intake</title>
<link rel="stylesheet" href="ifbase.css">
</head>
<body>
<div class="topbar">
  <span class="topbar-title" id="topbar-title-slot"></span>
  <div class="layout-toggle" id="layout-toggle">
    <button id="btn-wizard" type="button" class="active" onclick="setLayout('wizard')">Step-by-step</button>
    <button id="btn-grouped" type="button" onclick="setLayout('grouped')">All sections</button>
  </div>
</div>
<div class="if-shell" id="if-shell">
<div class="if-main">
<header class="header">
  <h1 id="heading-slot"></h1>
  <p id="subhead-slot"></p>
</header>
<div class="progress-bar" id="progress-bar-wrap">
  <div class="progress-label">
    <span class="section-name" id="progress-section-label"></span>
    <span class="pct" id="progress-pct"></span>
  </div>
</div>
<main class="card fade-in" id="main-card">
  <form id="intake-form" autocomplete="off" onsubmit="return false">
    <div id="layout-wizard"></div>
    <div id="layout-grouped"></div>
  </form>
</main>
</div>
</div>

<!--
  ─────────────────────────────────────────────────────────────
  FORM SPEC — this is the ONLY block the agent edits.
  Everything else (layout, wiring, both views) is generated by ifbase.js.
  Schema: see SKILL.md
  ─────────────────────────────────────────────────────────────
-->
<script id="form-spec" type="application/json">
{
  "title": "Intake",
  "heading": "What are we building?",
  "subhead": "Why this form exists, what changes for the reader once it's answered, and how long it takes.",
  "exportTitle": "INTAKE EXPORT",
  "sections": [
    {
      "name": "Section A",
      "questions": [
        {
          "id": "example",
          "type": "radio",
          "kind": "judgment",
          "why": "Why this decision matters to the reader. Replace this whole spec block.",
          "label": "Example question?",
          "stakes": "What changes for the reader under each answer.",
          "recommendation": { "value": "yes", "confidence": "medium", "because": "Your reason, in the reader's terms. Never pre-select." },
          "required": true,
          "options": [
            { "value": "yes", "label": "Yes" },
            { "value": "no", "label": "No" }
          ]
        }
      ]
    }
  ],
  "knownContext": [],
  "routing": {}
}
</script>

<script src="ifbase.js"></script>
</body>
</html>
